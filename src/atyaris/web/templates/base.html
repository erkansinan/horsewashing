<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Turkiye At Yarisi Tahmin Araci{% endblock %}</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 1.5rem auto; padding: 0 1rem; max-width: min(1400px, 100%); color: #e0e0e0; background: #121212; line-height: 1.45; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    .skip-link { position: absolute; left: -999px; top: 0; background: #1565c0; color: #fff; padding: 0.4rem 0.8rem; z-index: 10; }
    .skip-link:focus { left: 0.5rem; }
    .site-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
    .site-nav h1 { margin: 0 1rem 0 0; }
    main { overflow-x: auto; }
    form.filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-bottom: 1.5rem; }
    form.filters label { display: flex; flex-direction: column; font-size: 0.8rem; color: #b0b0b0; }
    form.filters input, form.filters select { padding: 0.35rem; color: #e0e0e0; background: #242424; border: 1px solid #555; }
    a { color: #90caf9; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #ffca28; outline-offset: 2px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 0.5rem; }
    th, td { border: 1px solid #444; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { color: #f5f5f5; background: #2a2a2a; }
    tr:nth-child(even) { background: #1e1e1e; }
    tbody tr:hover { background: #26323a; }
    .error { background: #3b1e1e; border: 1px solid #7a3030; color: #ffb4ab; padding: 0.75rem 1rem; border-radius: 4px; }
    .data-warning { color: #ffb4ab; background: #3b1e1e; padding: 0.15rem 0.3rem; }
    .disclaimer { margin-top: 1.5rem; padding: 0.75rem 1rem; background: #332b14; border: 1px solid #8a742f; color: #f5e6b3; font-style: italic; font-size: 0.85rem; }
    .tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.8rem; color: #e0e0e0; background: #333; }
    .reasoning { margin: 0 0 1rem 0; padding-left: 1.2rem; font-size: 0.9rem; }
    .training-panel { margin: 1.5rem 0; padding: 1rem; border: 1px solid #455a64; background: #1e272b; border-radius: 4px; }
    .training-panel h2 { margin-top: 0; }
    .training-status { margin-top: 0.75rem; padding: 0.6rem 0.8rem; background: #151515; border: 1px solid #455a64; font-family: monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .training-status[data-state="completed"] { border-color: #66bb6a; color: #a5d6a7; }
    .training-status[data-state="failed"] { border-color: #ef9a9a; color: #ffb4ab; }
    a.button, button { display: inline-block; background: #1565c0; color: #fff; border: none; padding: 0.45rem 0.9rem; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 0.9rem; }
    a.button:hover, button:hover { background: #1976d2; }
    button:disabled { opacity: 0.6; cursor: progress; }
    a.horse-list { font-size: 0.8rem; color: #b0bec5; }
    @media (max-width: 640px) {
      th, td { padding: 0.3rem 0.4rem; font-size: 0.8rem; }
      form.filters label, form.filters button { flex: 1 1 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Icerige gec</a>
  <nav class="site-nav" aria-label="Ana gezinme">
    <h1><a href="/" style="color:inherit; text-decoration:none;">Ana sayfa</a></h1>
    <a class="button" href="/training">ML Eğitim</a>
  </nav>
  <main id="main-content">
  {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      const trainingJobId = {{ active_training_job_id()|tojson }};
      if (!trainingJobId) return;

      const warning = "Model eğitimi sürüyor. Bu işlemi onaylarsanız devam eden eğitim durdurulacaktır. Devam etmek istiyor musunuz?";
      let cancellationRequested = false;

      const cancelTraining = async () => {
        if (cancellationRequested) return;
        cancellationRequested = true;
        try {
          await fetch("/train/cancel/" + encodeURIComponent(trainingJobId), { method: "POST" });
        } catch (error) {
          cancellationRequested = false;
          throw error;
        }
      };

      document.addEventListener("click", async (event) => {
        const target = event.target.closest("a, button");
        if (!target || target.dataset.trainingConfirmed === "true") return;
        if (target.tagName === "BUTTON" && target.type !== "button") return;
        if (target.dataset.trainingControl === "true") return;
        if (target.tagName === "A" && new URL(target.href, window.location.href).pathname === window.location.pathname) return;
        if (!window.confirm(warning)) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        target.dataset.trainingConfirmed = "true";
        await cancelTraining();
        if (target.tagName === "A") window.location.assign(target.href);
        else target.click();
      });

      document.addEventListener("submit", async (event) => {
        const form = event.target;
        if (form.dataset.trainingConfirmed === "true") return;
        if (!window.confirm(warning)) {
          event.preventDefault();
          return;
        }
        event.preventDefault();
        form.dataset.trainingConfirmed = "true";
        await cancelTraining();
        form.submit();
      });
    })();
  </script>
</body>
</html>
