<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Turkiye At Yarisi Tahmin Araci{% endblock %}</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 2rem auto; max-width: 960px; color: #1a1a1a; background: #fafafa; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    form.filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-bottom: 1.5rem; }
    form.filters label { display: flex; flex-direction: column; font-size: 0.8rem; color: #444; }
    form.filters input, form.filters select { padding: 0.35rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 0.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #eee; }
    tr:nth-child(even) { background: #f2f2f2; }
    .error { background: #fdecea; border: 1px solid #f5c2c0; color: #8a1f11; padding: 0.75rem 1rem; border-radius: 4px; }
    .disclaimer { margin-top: 1.5rem; padding: 0.75rem 1rem; background: #fff8e1; border: 1px solid #ffe082; font-style: italic; font-size: 0.85rem; }
    .tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 3px; font-size: 0.8rem; background: #e0e0e0; }
    .reasoning { margin: 0 0 1rem 0; padding-left: 1.2rem; font-size: 0.9rem; }
    a.button, button { display: inline-block; background: #1565c0; color: #fff; border: none; padding: 0.45rem 0.9rem; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 0.9rem; }
    a.horse-list { font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <h1><a href="/" style="color:inherit; text-decoration:none;">Turkiye At Yarisi Tahmin Araci</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
